<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Legend of Meile — 22 Years at UGA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Press Start 2P',monospace}
#wrap{position:relative;width:960px;height:540px}
canvas{width:960px;height:540px;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;cursor:pointer;transition:opacity 0.5s}
#overlay h1{color:#ffcc00;font-size:18px;text-align:center;line-height:2.2;text-shadow:3px 3px #4a3500}
#overlay .sub{color:#ba0c2f;font-size:11px;margin-top:10px;letter-spacing:2px}
#overlay .start{color:#aaa;font-size:10px;margin-top:40px;animation:blink 1s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="960" height="540"></canvas>
<div id="overlay" onclick="begin()">
  <h1>🎮 THE LEGEND OF MEILE 🎮</h1>
  <div class="sub">— 22 YEARS AT THE UNIVERSITY OF GEORGIA —</div>
  <div class="start">▶ CLICK TO START ◀</div>
</div>
</div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540;
let AC,MG,playing=false,T0=0;

// COLOR PALETTE
const P={
  skin:'#F2C5A0',skinLt:'#FADCBE',skinMd:'#D9A87C',skinDk:'#BF8A5E',skinSh:'#A06E44',
  hair1:'#A8A8B0',hair2:'#8E8E98',hair3:'#B8B8C2',hair4:'#787882',hair5:'#C8C8D0',hairDk:'#606068',
  shirt1:'#C8D8E8',shirt2:'#A8C0D8',shirt3:'#90B0C8',shirtStr:'#D8E4F0',
  white:'#F8F8F8',cream:'#FFF8E8',black:'#101018',
  gold:'#FFD040',goldDk:'#C8A020',goldLt:'#FFE880',
  ugaRed:'#BA0C2F',ugaRedDk:'#8A0820',
  sky1:'#88C8F8',sky2:'#60A8E8',sky3:'#4888D0',
  grass1:'#48A848',grass2:'#389038',grass3:'#287828',grass4:'#68C068',
  mt1:'#607080',mt2:'#506070',mtSnow:'#E8F0F8',
  water1:'#2060A0',water2:'#184880',
  wood:'#8B6914',woodDk:'#6B4E10',woodLt:'#AB8934',
  stone:'#909098',stoneDk:'#686870',stoneLt:'#B0B0B8',
  coffee:'#6F4E37',coffeeLt:'#9F7E57',swiss:'#FF0000',
};

function px(x,y,w,h,c){X.fillStyle=c;X.fillRect(Math.round(x),Math.round(y),w,h);}
function pxC(cx,cy,r,c){X.fillStyle=c;X.beginPath();X.arc(cx,cy,r,0,Math.PI*2);X.fill();}
function pxG(x,y,w,h,c1,c2,v=true){
  const g=v?X.createLinearGradient(x,y,x,y+h):X.createLinearGradient(x,y,x+w,y);
  g.addColorStop(0,c1);g.addColorStop(1,c2);X.fillStyle=g;X.fillRect(x,y,w,h);
}
function pxRR(x,y,w,h,r,c){X.fillStyle=c;X.beginPath();X.roundRect(x,y,w,h,r);X.fill();}

// ══════ HIGH-DETAIL DR. MEILE PORTRAIT ══════
// 64x80 pixel grid at given scale. Accurate: grey wavy hair, warm brown eyes,
// big genuine smile with teeth, strong nose, blue pinstripe shirt, white tee underneath

function drawPortrait(ox,oy,sc=3){
  const s=sc;
  // Back hair mass (voluminous grey)
  for(let i=-2;i<34;i++)for(let j=-4;j<18;j++){
    const dx=i-16,dy=j-6;
    if(dx*dx/280+dy*dy/160<1){
      const wave=Math.sin(i*0.4+j*0.2)*1.5;
      const ci=Math.abs((i+j*3+Math.floor(wave))%5);
      const cols=[P.hair2,P.hair1,P.hair3,P.hair4,P.hair5];
      px(ox+(i+16)*s,oy+(j+2)*s,s,s,cols[ci]);
    }
  }
  // Hair top sweep
  for(let i=6;i<38;i++)for(let j=-6;j<0;j++){
    const curve=Math.sin((i-20)*0.15)*3-2;
    if(j>curve-4&&j<curve+2){
      px(ox+(i+8)*s,oy+(j+2)*s,s,s,[P.hair3,P.hair1,P.hair5,P.hair2][(i+j*2)%4]);
    }
  }
  // Side hair
  for(let j=2;j<22;j++){for(let i=0;i<3+Math.sin(j*0.3);i++)px(ox+(13+i)*s,oy+(j+2)*s,s,s,P.hair4);}
  for(let j=2;j<20;j++){for(let i=0;i<3+Math.sin(j*0.25);i++)px(ox+(48-i)*s,oy+(j+2)*s,s,s,P.hair2);}

  // Face oval
  for(let i=0;i<22;i++)for(let j=0;j<28;j++){
    const dx=i-11,dy=j-12;
    if(dx*dx/130+dy*dy/200<1){
      let c=P.skin;
      if(dx<-4)c=P.skinMd;if(dy>10)c=P.skinMd;
      if(dy>14&&Math.abs(dx)>6)c=P.skinSh;
      if(dy<-2&&Math.abs(dx)<8)c=P.skinLt;
      px(ox+(i+20)*s,oy+(j+8)*s,s,s,c);
    }
  }
  // Wider forehead
  for(let i=-1;i<23;i++)for(let j=0;j<5;j++){
    if(Math.abs(i-11)<12-j*0.5) px(ox+(i+20)*s,oy+(j+6)*s,s,s,j<2?P.skinLt:P.skin);
  }

  // LEFT EYE
  for(let i=0;i<6;i++)px(ox+(24+i)*s,oy+15*s,s,s,P.hair4);// brow
  for(let i=0;i<5;i++)for(let j=0;j<3;j++)px(ox+(25+i)*s,oy+(17+j)*s,s,s,P.white);
  px(ox+27*s,oy+17*s,s*2,s*2,'#5C4830');// iris
  px(ox+27*s,oy+18*s,s,s,P.black);// pupil
  px(ox+28*s,oy+17*s,s,s,'#E8E0D8');// highlight
  px(ox+23*s,oy+18*s,s,s,P.skinMd);px(ox+23*s,oy+19*s,s,s,P.skinMd);// crow's feet
  for(let i=0;i<5;i++)px(ox+(25+i)*s,oy+16*s,s,s,P.skinDk);// upper lid
  for(let i=0;i<4;i++)px(ox+(25+i)*s,oy+20*s,s,s,P.skinMd);// lower lid squint

  // RIGHT EYE
  for(let i=0;i<6;i++)px(ox+(33+i)*s,oy+15*s,s,s,P.hair4);
  for(let i=0;i<5;i++)for(let j=0;j<3;j++)px(ox+(33+i)*s,oy+(17+j)*s,s,s,P.white);
  px(ox+35*s,oy+17*s,s*2,s*2,'#5C4830');
  px(ox+35*s,oy+18*s,s,s,P.black);
  px(ox+36*s,oy+17*s,s,s,'#E8E0D8');
  px(ox+39*s,oy+18*s,s,s,P.skinMd);px(ox+39*s,oy+19*s,s,s,P.skinMd);
  for(let i=0;i<5;i++)px(ox+(33+i)*s,oy+16*s,s,s,P.skinDk);
  for(let i=0;i<4;i++)px(ox+(34+i)*s,oy+20*s,s,s,P.skinMd);

  // NOSE
  px(ox+31*s,oy+20*s,s,s,P.skinMd);px(ox+31*s,oy+21*s,s,s,P.skinMd);
  px(ox+31*s,oy+22*s,s*2,s,P.skinDk);
  px(ox+30*s,oy+23*s,s,s,P.skinMd);px(ox+31*s,oy+23*s,s*2,s,P.skinDk);px(ox+33*s,oy+23*s,s,s,P.skinMd);
  px(ox+30*s,oy+24*s,s,s,P.skinSh);px(ox+33*s,oy+24*s,s,s,P.skinSh);

  // MOUTH — wide warm smile with teeth
  for(let i=0;i<10;i++){
    const cv=i<2||i>7?1:0;
    px(ox+(27+i)*s,oy+(26+cv)*s,s,s,'#C08070');
  }
  for(let i=0;i<8;i++)px(ox+(28+i)*s,oy+27*s,s,s,P.white);// teeth
  for(let i=0;i<8;i++){
    const cv=i<1||i>6?0:1;
    px(ox+(28+i)*s,oy+(28+cv)*s,s,s,'#B87068');
  }
  // Nasolabial folds
  for(let j=0;j<4;j++){px(ox+26*s,oy+(23+j)*s,s,s,P.skinMd);px(ox+37*s,oy+(23+j)*s,s,s,P.skinMd);}
  // Chin
  for(let i=0;i<6;i++)px(ox+(29+i)*s,oy+32*s,s,s,P.skinMd);

  // NECK
  for(let i=0;i<8;i++)for(let j=0;j<5;j++)px(ox+(27+i)*s,oy+(34+j)*s,s,s,j>2?P.skinMd:P.skin);

  // WHITE TEE V-neck
  for(let i=0;i<12;i++)for(let j=0;j<4;j++){
    if(Math.abs(i-6)<j+2)px(ox+(26+i)*s,oy+(38+j)*s,s,s,P.white);
  }
  // BLUE PINSTRIPE SHIRT
  for(let i=-4;i<40;i++)for(let j=0;j<28;j++){
    const dx=i-18;
    if(Math.abs(dx)<20+j*0.3){
      if(j<4&&Math.abs(dx)<8)continue;
      const isS=i%4===0;
      let c=isS?P.shirtStr:((i+j)%8<2?P.shirt3:P.shirt1);
      if(dx<-10)c=isS?P.shirt2:P.shirt3;
      px(ox+(i+22)*s,oy+(j+39)*s,s,s,c);
    }
  }
  // Collar flaps
  for(let j=0;j<6;j++){
    px(ox+(24-j)*s,oy+(38+j)*s,s*2,s,P.shirt1);
    px(ox+(37+j)*s,oy+(38+j)*s,s*2,s,P.shirt1);
  }
}

// WALKING BODY SPRITE
function drawBody(ox,oy,sc=2,frame=0,dir=1){
  const s=sc;
  X.save();
  if(dir<0){X.translate(ox+32*s,0);X.scale(-1,1);ox=0;}
  // Hair
  for(let i=0;i<18;i++)for(let j=0;j<9;j++){
    const dx=i-9,dy=j-4;
    if(dx*dx/90+dy*dy/25<1)px(ox+(i+5)*s,oy+j*s,s,s,[P.hair1,P.hair2,P.hair3,P.hair4,P.hair5][(i+j*2)%5]);
  }
  for(let i=0;i<14;i++){const cv=Math.sin(i*0.5)*2;if(cv<0)px(ox+(i+7)*s,oy+cv*s,s,s,P.hair3);}
  // Face
  for(let i=0;i<12;i++)for(let j=0;j<12;j++){
    const dx=i-6,dy=j-5;
    if(dx*dx/40+dy*dy/40<1){
      let c=P.skin;if(dx<-2)c=P.skinMd;if(dy>4)c=P.skinMd;
      px(ox+(i+8)*s,oy+(j+7)*s,s,s,c);
    }
  }
  // Eyes
  px(ox+11*s,oy+12*s,s*2,s,P.black);px(ox+16*s,oy+12*s,s*2,s,P.black);
  px(ox+12*s,oy+11*s,s,s,'#E8E0D8');px(ox+17*s,oy+11*s,s,s,'#E8E0D8');
  // Smile
  for(let i=0;i<5;i++){const cv=i<1||i>3?0:1;px(ox+(12+i)*s,oy+(16+cv)*s,s,s,'#C08070');}
  for(let i=0;i<3;i++)px(ox+(13+i)*s,oy+17*s,s,s,'#F0F0F0');
  // Nose
  px(ox+14*s,oy+14*s,s,s,P.skinDk);
  // Neck + white tee
  for(let i=0;i<4;i++)px(ox+(12+i)*s,oy+19*s,s,s*2,P.skin);
  for(let i=0;i<5;i++)px(ox+(12+i)*s,oy+21*s,s,s,P.white);
  // Shirt body
  for(let i=0;i<20;i++)for(let j=0;j<14;j++){
    const dx=i-10;if(Math.abs(dx)<10+j*0.2){
      if(j<2&&Math.abs(dx)<3)continue;
      px(ox+(i+4)*s,oy+(j+22)*s,s,s,i%3===0?P.shirtStr:P.shirt1);
    }
  }
  // Arms
  const sw=Math.sin(frame*0.15)*3;
  for(let j=0;j<10;j++){
    px(ox+3*s,oy+(24+j+sw)*s,s*2,s,j>7?P.skin:P.shirt2);
    px(ox+23*s,oy+(24+j-sw)*s,s*2,s,j>7?P.skin:P.shirt2);
  }
  px(ox+3*s,oy+(34+sw)*s,s*2,s*2,P.skin);px(ox+23*s,oy+(34-sw)*s,s*2,s*2,P.skin);
  // Pants
  for(let i=0;i<7;i++)for(let j=0;j<12;j++)px(ox+(7+i)*s,oy+(36+j)*s,s,s,'#4A4A58');
  for(let i=0;i<7;i++)for(let j=0;j<12;j++)px(ox+(15+i)*s,oy+(36+j)*s,s,s,'#4A4A58');
  const lp=Math.sin(frame*0.15)*2;
  px(ox+8*s,oy+(47+lp)*s,s*5,s*2,'#4A4A58');px(ox+16*s,oy+(47-lp)*s,s*5,s*2,'#4A4A58');
  // Shoes
  px(ox+7*s,oy+(49+lp)*s,s*6,s*2,'#3A2A1A');px(ox+16*s,oy+(49-lp)*s,s*6,s*2,'#3A2A1A');
  X.restore();
}

// ══════ ENVIRONMENT DRAWING ══════
function drawSwissFlag(x,y,sz){px(x,y,sz,sz,P.swiss);px(x+sz*.375,y+sz*.125,sz*.25,sz*.75,P.white);px(x+sz*.125,y+sz*.375,sz*.75,sz*.25,P.white);}
function drawSky(t){pxG(0,0,W,H*0.6,P.sky3,P.sky1);for(let i=0;i<5;i++){const cx=((i*220+t*20)%1200)-120,cy=40+i*30+Math.sin(i*2)*20;pxC(cx,cy,25+i*5,'rgba(255,255,255,0.5)');pxC(cx+20,cy-5,20+i*3,'rgba(255,255,255,0.4)');}}
function drawAlps(yB){
  X.fillStyle=P.mt2;X.beginPath();X.moveTo(0,yB);
  [[80,yB-120],[200,yB-80],[340,yB-160],[480,yB-90],[600,yB-140],[750,yB-100],[900,yB-130],[960,yB-60]].forEach(([x,y])=>X.lineTo(x,y));
  X.lineTo(W,yB);X.closePath();X.fill();
  X.fillStyle=P.mt1;X.beginPath();X.moveTo(0,yB+20);
  [[100,yB-60],[250,yB-30],[400,yB-80],[550,yB-40],[700,yB-70],[850,yB-30],[960,yB]].forEach(([x,y])=>X.lineTo(x,y));
  X.lineTo(W,yB+20);X.closePath();X.fill();
  X.fillStyle=P.mtSnow;
  [[340,yB-160,30],[600,yB-140,25],[900,yB-130,20],[80,yB-120,18]].forEach(([x,y,r])=>{X.beginPath();X.moveTo(x-r,y+r*.6);X.lineTo(x,y);X.lineTo(x+r,y+r*.6);X.closePath();X.fill();});
}
function drawMeadow(yB){pxG(0,yB,W,H-yB,P.grass1,P.grass3);for(let x=0;x<W;x+=6){const h=4+Math.sin(x*.3)*2;px(x,yB-h,3,h+2,P.grass4);}for(let i=0;i<20;i++){const fx=(i*97)%W,fy=yB+20+(i*53)%80;px(fx,fy,3,3,['#F8E040','#F060A0','#F0F0F8','#A060F0'][i%4]);}}
function drawCoffee(x,y,sc,stm){const s=sc;pxC(x+8*s,y+18*s,10*s,'#E0D8D0');pxRR(x,y,16*s,16*s,3*s,'#F8F0E8');pxRR(x+2*s,y+3*s,12*s,10*s,2*s,P.coffee);px(x+4*s,y+5*s,6*s,2*s,P.coffeeLt);px(x+16*s,y+4*s,4*s,2*s,'#E8E0D8');px(x+18*s,y+4*s,2*s,8*s,'#E8E0D8');px(x+16*s,y+10*s,4*s,2*s,'#E8E0D8');for(let i=0;i<3;i++){const sx2=x+(4+i*4)*s,sy2=y-6*s+Math.sin(stm*.08+i*2)*3*s;X.fillStyle=`rgba(255,255,255,${.3+Math.sin(stm*.05+i)*.2})`;X.fillRect(sx2,sy2,2*s,4*s);}}
function drawFrozenBox(x,y,sc){const s=sc;pxRR(x,y,20*s,24*s,2*s,'#E84040');px(x+2*s,y+2*s,16*s,8*s,'#F8F0E0');px(x+4*s,y+4*s,12*s,4*s,P.ugaRed);for(let i=0;i<4;i++)px(x+(3+i*4)*s,y+(14+i%2*3)*s,2*s,2*s,'#C8D8F0');px(x+2*s,y+18*s,16*s,4*s,'#F8D848');}
function drawLaptop(x,y,sc){const s=sc;pxRR(x,y,32*s,22*s,2*s,'#303038');pxG(x+2*s,y+2*s,28*s,18*s,'#0A1428','#102040');const cls=['#60F060','#40A0F0','#F0E040','#F08040','#A070F0'];for(let j=0;j<7;j++){px(x+4*s,y+(4+j*2)*s,(6+(j*7)%12)*s,s*.8,cls[j%5]);}pxRR(x-2*s,y+22*s,36*s,3*s,1*s,'#484850');}
function drawMicrobe(x,y,f,sc){const w=Math.sin(f*.06)*3*sc;pxC(x+w,y,10*sc,'#40A848');pxC(x+w,y,7*sc,'#60C868');for(let i=0;i<3;i++){const a=i*2.1+f*.04,fx2=x+w+Math.cos(a)*14*sc,fy2=y+Math.sin(a)*14*sc;X.strokeStyle='#40A848';X.lineWidth=2*sc;X.beginPath();X.moveTo(x+w,y);X.quadraticCurveTo(x+w+(fx2-x)*.5,fy2+5*sc,fx2,fy2);X.stroke();}pxC(x-3*sc+w,y-2*sc,2.5*sc,P.white);pxC(x+3*sc+w,y-2*sc,2.5*sc,P.white);pxC(x-2*sc+w,y-1*sc,1.2*sc,P.black);pxC(x+4*sc+w,y-1*sc,1.2*sc,P.black);}
function drawUGAArch(x,y,sc){const s=sc;px(x,y+30*s,20*s,80*s,P.stone);px(x+80*s,y+30*s,20*s,80*s,P.stone);px(x+30*s,y+30*s,12*s,80*s,P.stoneDk);px(x-5*s,y+15*s,110*s,18*s,P.stoneLt);px(x-2*s,y+8*s,104*s,10*s,P.stone);for(let i=0;i<7;i++)px(x+(15+i*10)*s,y+33*s,2*s,77*s,'#282828');px(x+12*s,y+60*s,78*s,2*s,'#282828');px(x+10*s,y+5*s,80*s,5*s,P.stoneDk);}

function drawTitle(text,x,y,sz=14,c=P.gold,sh=true){X.font=`${sz}px "Press Start 2P",monospace`;X.textAlign='center';if(sh){X.fillStyle='rgba(0,0,0,0.6)';X.fillText(text,x+2,y+2);}X.fillStyle=c;X.fillText(text,x,y);}
function drawDialog(x,y,w,h,title,body,f){
  px(x,y,w,h,'rgba(0,0,20,0.92)');X.strokeStyle=P.gold;X.lineWidth=3;X.strokeRect(x+2,y+2,w-4,h-4);
  X.strokeStyle=P.goldDk;X.lineWidth=1;X.strokeRect(x+6,y+6,w-12,h-12);
  [[x+4,y+4],[x+w-10,y+4],[x+4,y+h-10],[x+w-10,y+h-10]].forEach(([cx,cy])=>{px(cx,cy,6,6,P.gold);px(cx+1,cy+1,4,4,P.goldLt);px(cx+2,cy+2,2,2,P.white);});
  X.font='10px "Press Start 2P",monospace';X.textAlign='center';X.fillStyle=P.white;X.fillText(title,x+w/2,y+24);
  X.font='8px "Press Start 2P",monospace';X.fillStyle=P.goldLt;X.fillText(body,x+w/2,y+44);
}
function drawBubble(x,y,lines){
  const mw=Math.max(...lines.map(l=>l.length))*7+24,h=lines.length*14+16;
  pxRR(x,y,mw,h,8,P.white);X.strokeStyle='#404048';X.lineWidth=2;X.beginPath();X.roundRect(x,y,mw,h,8);X.stroke();
  X.fillStyle=P.white;X.beginPath();X.moveTo(x+20,y+h);X.lineTo(x+15,y+h+12);X.lineTo(x+30,y+h);X.fill();X.stroke();
  X.font='7px "Press Start 2P",monospace';X.fillStyle='#202028';X.textAlign='left';
  lines.forEach((l,i)=>X.fillText(l,x+12,y+16+i*14));
}
function drawStatBar(x,y,w,label,val,anim,color){
  const fill=Math.min(val,anim)/100;
  X.font='7px "Press Start 2P",monospace';X.textAlign='left';X.fillStyle='#B0B0C0';X.fillText(label,x,y);
  px(x+140,y-8,w,12,'#1A1A30');X.strokeStyle='#404060';X.lineWidth=1;X.strokeRect(x+140,y-8,w,12);
  pxG(x+141,y-7,Math.floor((w-2)*fill),10,color,'#000');

// ══════ MAIN LOOP ══════
function elapsed(){return playing?(Date.now()-T0)/1000:0;}
function render(){
  const t=elapsed(),f=Math.floor(t*30);
  let sc=SC[SC.length-1];for(const s of SC)if(t>=s.s&&t<s.e){sc=s;break;}
  X.fillStyle='#000';X.fillRect(0,0,W,H);
  sc.r(t,f);
  // Scanlines
  X.fillStyle='rgba(0,0,0,0.05)';for(let y=0;y<H;y+=2)X.fillRect(0,y,W,1);
  // Vignette
  const vg=X.createRadialGradient(W/2,H/2,W*.3,W/2,H/2,W*.7);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.25)');X.fillStyle=vg;X.fillRect(0,0,W,H);
  // Transitions
  for(const s of SC)if(Math.abs(t-s.s)<.3){X.fillStyle=`rgba(0,0,0,${(1-Math.abs(t-s.s)/.3)*.7})`;X.fillRect(0,0,W,H);}
  // Progress
  const prog=Math.min(t/80,1);px(0,H-3,W,3,'#222');px(0,H-3,W*prog,3,P.ugaRed);
  if(t>=80){playing=false;document.getElementById('overlay').classList.remove('hidden');document.getElementById('overlay').querySelector('.start').textContent='▶ CLICK TO REPLAY ◀';return;}
  requestAnimationFrame(render);
}
function begin(){
  document.getElementById('overlay').classList.add('hidden');
  if(!AC)initAudio();
  playOST();playing=true;T0=Date.now();render();
}
